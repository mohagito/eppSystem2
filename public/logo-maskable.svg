<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Deep Slate-Navy Base Background -->
  <rect width="100%" height="100%" fill="#0a1224" />

  <!-- EPP Natur Branding Logo Artwork (Scaled down slightly for safe-zone padding) -->
  <g transform="translate(45, 90) scale(0.85)">
    <!-- Iconic Left Wing Wave Swoosh -->
    <path d="M 80 180 C 130 90, 250 90, 280 180 C 220 145, 140 145, 80 180 Z" fill="#FF7700" />
    
    <!-- Iconic Right Wing Wave Swoosh (Overlap) -->
    <path d="M 180 180 C 230 95, 350 95, 380 180 C 320 145, 240 145, 180 180 Z" fill="#FF7700" />

    <!-- E.P.P. Orange Text Badge -->
    <text x="350" y="202" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="34" fill="#FF7700" letter-spacing="1.5">E.P.P.</text>
    
    <!-- Natur Silver-Steel Branding Title -->
    <text x="75" y="305" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="110" fill="#a1a1aa" letter-spacing="-4">Natur</text>
  </g>
</svg>
