<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EPP MES" />
    <link rel="apple-touch-icon" href="/logo-192.webp" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/webp" href="https://www.eppnatur.es/media/yootheme/cache/1c/logo_eppnatur_3-1ce587ca.webp" />
    <meta name="description" content="Premium industrial manufacturing dashboard for managing airbag stock entries and production plans." />
    <title>EPP Airbag System</title>
    <script>
      // Clear any conflicting service workers and stale caches to prevent blank screen
      if (typeof window !== 'undefined' && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        }).catch(function(e) { console.debug(e); });
      }
      if (typeof window !== 'undefined' && 'caches' in window) {
        caches.keys().then(function(names) {
          for (var i = 0; i < names.length; i++) {
            caches.delete(names[i]);
          }
        }).catch(function(e) { console.debug(e); });
      }
    </script>
  </head>
  <body class="bg-slate-900 text-slate-100">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif; color: #f8fafc; text-align: center; padding: 24px;">
        <div style="width: 48px; height: 48px; border: 4px solid rgba(16, 185, 129, 0.2); border-top-color: #10b981; border-radius: 50%; animation: epp-spin 0.8s linear infinite; margin-bottom: 20px;"></div>
        <div style="font-weight: 800; font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase; color: #f1f5f9;">EPP Airbag MES</div>
        <div style="font-size: 11px; color: #94a3b8; margin-top: 6px; letter-spacing: 0.05em;">Connecting digital manufacturing workspace...</div>
        <style>@keyframes epp-spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
